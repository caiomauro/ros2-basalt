name: build-and-test

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-humble:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3-pip \
            python3-colcon-common-extensions \
            python3-rosdep

      - name: Install modern CMake
        run: |
          python3 -m pip install --user "cmake>=3.24,<4"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialize rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      - name: Install ROS package dependencies
        run: |
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths . --ignore-src -r -y

      - name: Build pinned Basalt dependency
        run: ./scripts/setup_basalt.sh

      - name: Build and test basalt_wrapper
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths . --packages-select basalt_wrapper \
            --cmake-clean-cache --event-handlers console_direct+
          colcon test --base-paths . --packages-select basalt_wrapper \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: Smoke-test the installed node
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          export ROS_LOCALHOST_ONLY=1
          set +e
          timeout --signal=INT --kill-after=10s 5s \
            install/basalt_wrapper/lib/basalt_wrapper/basalt_node \
            --ros-args \
            -p left_image_topic:=/cam0/image_raw \
            -p right_image_topic:=/cam1/image_raw \
            -p imu_topic:=/imu0 \
            -p calib_path:="$GITHUB_WORKSPACE/config/x500_stereo_sim_calib.json" \
            -p config_path:="$GITHUB_WORKSPACE/config/x500_stereo_sim_safe_config.json" \
            -p input_mode:=ros_topics > /tmp/basalt_wrapper_smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat /tmp/basalt_wrapper_smoke.log
            exit 1
          fi
          grep -F "subscriptions/publisher ready" /tmp/basalt_wrapper_smoke.log
          grep -F "Finished VIOFilter before first IMU" /tmp/basalt_wrapper_smoke.log

      - name: Verify relocatable runtime paths
        run: |
          if readelf -d install/basalt_wrapper/lib/basalt_wrapper/basalt_node \
            | grep -F "$GITHUB_WORKSPACE"; then
            echo "Installed basalt_node contains a workspace path" >&2
            exit 1
          fi
