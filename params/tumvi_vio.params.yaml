basalt_node:
  ros__parameters:
    use_sim_time: true

    left_image_topic: /cam0/image_raw
    right_image_topic: /cam1/image_raw
    imu_topic: /imu0

    use_imu: true
    use_double: false
    use_header_timestamps: true

    path_frame_id: basalt_world
    body_frame_id: basalt_body
    publish_rate_hz: 100.0
    max_path_length: 10000

    # Replace these two paths with the actual files you want to use.
    calib_path: /ABSOLUTE/PATH/TO/tumvi_stereo_calib.json
    config_path: /ABSOLUTE/PATH/TO/tumvi_config.json
